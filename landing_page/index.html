<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
</head>
<body class="font-google relative"> 
    <!-- BG DESIGNS -->
    <!-- <div class="w-80 h-80 rounded-4xl bg-accent/10 absolute -z-100 blur animate-pulse"></div> -->

    <!-- Navbar -->
    <div class="flex bg-accent/20 w-full h-16 items-center justify-between px-24">
        <div class="flex items-center gap-0.5 font-bold text-lg ">
            <h1 class="text-accent text-shadow-accent/20 text-shadow-sm">Cake</h1>
            <h1 class="text-accent-dark text-shadow-accent/20 text-shadow-sm">Track</h1>
        </div>

        <button class="p-2.5 px-6 rounded-sm bg-gradient-to-tr from-accent to-accent-dark text-main shadow-accent shadow-sm cursor-pointer text-xs tracker-wide font-semibold">Download App</button>
    </div>

    <!-- Body -->
    <div class="bg-missing-fill/20 w-full h-screen flex items-center justify-center pt-24">
        <div class="flex-1 px-20 h-screen">
            <div class="bg-accent/5 h-4/5 w-full flex flex-col justify-center rounded-4xl items-start text-left px-8">
                <h1 class="font-extrabold text-6xl text-accent-dark tracking-tight">Designed by you,</h1>
                <h1 class="font-extrabold text-6xl text-accent-dark tracking-tight">Baked by us.</h1>
                <h5 class="my-4 font-base text-base text-accent-dark/50 -line-height-2">Deliciously Crafted, Perfectly Sweet. Order premade cakes, or build your own custom one. Have a taste of fine pastry.</h5>
                <button class="p-2.5 px-6 rounded-md bg-accent-dark text-main shadow-accent shadow-sm cursor-pointer text-lg tracker-wide font-semibold hover:bg-gradient-to-br hover:from-accent-dark hover:to-accent/20 transition">Download CakeTrack!</button>

                <div class="font-semibold text-xs tracking-tight text-accent-dark/50 mt-4 flex gap-8 uppercase">
                    <div class="animate-pulse flex gap-2 items-center">
                        <div class="h-2 w-2 rounded-full bg-accent-dark"></div>
                        <h5>Android</h5>
                    </div>
                    <div class="animate-pulse flex gap-2 items-center">
                        <div class="h-2 w-2 rounded-full bg-accent-dark"></div>
                        <h5>React Native</h5>
                    </div>
                    <div class="animate-pulse flex gap-2 items-center">
                        <div class="h-2 w-2 rounded-full bg-accent-dark"></div>
                        <h5>React</h5>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex-1 px-20 h-full  flex justify-end">
            <div class="bg-accent-dark h-4/5 w-90 rounded-t-4xl rounded-b-lg relative">
                <div class="bg-red-400 h-3/5 w-50 rounded-t-4xl rounded-b-lg absolute -bottom-10 -left-40">
                </div>
                <div class="bg-red-400 w-16 h-16 rounded-full absolute -top-4 -right-4">
                    <div class="bg-red-400 w-4 h-4 rounded-full absolute -top-4 -right-4">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--  -->
    <div class="w-full py-8 bg-accent-dark text-white shadow-sm flex flex-col items-center gap-4 relative">
        <div class="bg-accent w-8 h-8 rounded-full absolute right-20 top-5">
            <div class="bg-accent w-4 h-4 rounded-full absolute -left-5 -bottom-5 blur animate-pulse">
            </div>
        </div>
        <h1 class="uppercase font-semibold tracking-wide">Order Cakes</h1>
        <h5 class="font-medium text-2xl text-missing-fill">Choose from a myriad of selected delights!</h5>
        <div class="bg-accent w-8 h-8 rounded-full absolute left-20 bottom-5">
            <div class="bg-accent w-4 h-4 rounded-full absolute -top-5 -bottom-5 blur animate-pulse">
            </div>
        </div>
    </div>

    <div class="flex justify-center gap-4 w-full h-80 mt-2 border-t-4 border-t-accent-dark px-24 py-16">
        <div class="rounded-2xl h-120 flex-1 bg-accent-dark/10">
        </div>
        <div class="rounded-2xl h-120 flex-1 bg-accent-dark/10 translate-y-10">
        </div>
        <div class="rounded-2xl h-120 flex-1 bg-accent-dark/10">
        </div>
        <div class="rounded-2xl h-120 flex-1 bg-accent-dark/10 translate-y-10">
        </div>
    </div>

    <div class="h-80">

    </div>
</body>
</html>
