<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cake Track</title>
    <link rel="stylesheet" href="output.css">
</head>
<body class="w-full min-h-screen bg-lp-bg">
    <header class="w-full bg-lp-bg-2 sticky top-0 z-50 border-b border-gray-200">
    <div class="max-w-7xl mx-auto flex items-center justify-between p-4 px-6 md:px-8">
        <div class="flex font-extrabold text-2xl tracking-tight">
            <span class="text-lp-text">Cake</span><span class="text-lp-text-dark">Track</span>
        </div>
        <button class="bg-lp-text-dark hover:opacity-90 transition-opacity duration-200 text-white text-sm font-semibold py-2.5 px-5 rounded-full cursor-pointer shadow-sm">
            Download CakeTrack
        </button>
    </div>
</header>

<main class="w-full max-w-7xl mx-auto px-4 md:px-8 py-12 md:py-24">
    <div class="flex flex-col md:flex-row justify-between items-center gap-12 bg-lp-bg-2 rounded-3xl p-8 md:p-16 shadow-sm">
        
        <div class="flex-1 flex flex-col justify-center items-center md:items-start text-center md:text-left gap-6">
            <div class="space-y-2">
                <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight text-gray-900">Designed by you,</h1>
                <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight text-lp-text-dark">Baked by us.</h1>
            </div>
            <p class="text-lg md:text-xl font-medium text-gray-600 animate-pulse">Deliciously Crafted, Perfectly Sweet</p>
            <button class="mt-4 bg-lp-text-dark hover:-translate-y-0.5 transition-transform duration-200 text-white text-base font-semibold py-4 px-8 rounded-2xl shadow-lg">
                Download the App Here
            </button>
        </div>

        <div class="flex-1 w-full min-h-[300px] md:min-h-[400px] bg-gradient-to-br from-gray-100 to-gray-200 rounded-2xl hidden md:block border border-gray-100 shadow-inner">
            </div>

    </div>
</main>

    <section class="w-full max-w-7xl mx-auto px-4 md:px-8 py-16 md:py-24">
    <div class="text-center max-w-2xl mx-auto mb-16 space-y-4">
        <p class="text-sm font-bold tracking-widest text-lp-text uppercase">We got you!</p>
        <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight text-gray-900">Premade Cakes?</h2>
        <p class="text-lg text-gray-600 font-medium">Order from a myriad of cake selections prepared and designed with art.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8 items-start pb-12">
        
        <div class="relative w-full aspect-[3/4] rounded-3xl overflow-hidden bg-gray-200 shadow-md lg:translate-y-12 transition-transform duration-300 hover:scale-[1.03] hover:shadow-xl hover:z-10 cursor-pointer">
            <div class="absolute inset-0 bg-[url('./assets/images/cake-1.jpeg')] bg-cover bg-center"></div>
        </div>
        
        <div class="relative w-full aspect-[3/4] rounded-3xl overflow-hidden bg-gray-200 shadow-md transition-transform duration-300 hover:scale-[1.03] hover:shadow-xl hover:z-10 cursor-pointer">
            <div class="absolute inset-0 bg-[url('./assets/images/cake-2.jpeg')] bg-cover bg-center"></div>
        </div>

        <div class="relative w-full aspect-[3/4] rounded-3xl overflow-hidden bg-gray-200 shadow-md lg:translate-y-12 transition-transform duration-300 hover:scale-[1.03] hover:shadow-xl hover:z-10 cursor-pointer">
            <div class="absolute inset-0 bg-[url('./assets/images/cake-3.jpeg')] bg-cover bg-center"></div>
        </div>

        <div class="relative w-full aspect-[3/4] rounded-3xl overflow-hidden bg-gray-200 shadow-md transition-transform duration-300 hover:scale-[1.03] hover:shadow-xl hover:z-10 cursor-pointer">
            <div class="absolute inset-0 bg-[url('./assets/images/cake-4.jpeg')] bg-cover bg-center"></div>
        </div>

    </div>
</section>

    <div class="w-full h-screen bg-gray-400 flex md:flex-row flex-col justify-between items-center gap-4 p-4">
        <div class="flex-1 bg-white h-full">
            
        </div>
        <div class="flex-1">
            <h1>Or <strong>build</strong> your own cakes</h1>
        </div>
    </div>

    <div class="h-80 w-full bg-gray-100">

    </div>
    <div class="h-40 w-full bg-gray-200">

    </div>
</body>
</html>
